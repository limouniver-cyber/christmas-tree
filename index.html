<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>🎄圣诞快乐🎄</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/three.js/0.132.2/three.min.js"></script>
  <script>if (typeof THREE === 'undefined') document.write('<script src="https://unpkg.com/three@0.132.2/build/three.min.js"><\/script>');</script>
  <script>if (typeof THREE === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"><\/script>');</script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;cursor:grab;background:#05090d;}
    body{background:radial-gradient(ellipse at 50% 35%, #16323f 0%, #0c1f2e 45%, #05090d 100%);}
    .grabbing{cursor:grabbing;}
    canvas{display:block;touch-action:none;}
    .watermark{position:fixed;left:16px;bottom:max(12px,env(safe-area-inset-bottom));color:#dfdb4b;font:14px/1.4 sans-serif;opacity:.85;;text-shadow:0 1px 4px rgba(0,0,0,0.6);}
    /* ... existing code ... */
    #musicBtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:16px;z-index:10;width:46px;height:46px;border-radius:50%;border:1px solid #7c7362;background:rgba(20,30,40,0.6);color:#ffe08a;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    #musicBtn.playing{animation:spin 5s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    #startCover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%, rgba(22,50,63,0.94), rgba(5,9,13,0.98));transition:opacity .8s ease;}
    #startCover.hidden{opacity:0;pointer-events:none;}
    .cover-inner{text-align:center;color:#ffe9a8;}
    .cover-title{font-size:34px;font-weight:700;margin-bottom:12px;text-shadow:0 2px 10px rgba(0,0,0,.6);}
    .cover-sub{font-size:16px;opacity:.85;margin-bottom:28px;}
    #startBtn{font-size:20px;padding:12px 34px;border-radius:30px;border:1px solid #7c7362;background:rgba(255,224,138,0.14);color:#ffe08a;cursor:pointer;}
    #startBtn:hover{background:rgba(255,224,138,0.26);}
    /* ... existing code ... */
  </style>
</head>
<body>
  <div class="watermark">From 豆 To wy❤wax❤qxy</div>
  <!-- ... existing code ... -->
  <button id="musicBtn" title="背景音乐">🎵</button>
  <div id="startCover">
    <div class="cover-inner">
      <div class="cover-title">🎄 圣诞快乐 🎄</div>
      <div class="cover-sub">From 豆 To wy❤wax❤qxy</div>
      <button id="startBtn">点击开始 ▶</button>
    </div>
  </div>
  <!-- ... existing code ... -->
  <script>
    const isMobile = matchMedia('(pointer:coarse)').matches || innerWidth < 768;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // 灯光
    scene.add(new THREE.AmbientLight(0x445566, 0.8));
    const keyLight = new THREE.PointLight(0xffffff, 1.2, 80); keyLight.position.set(8, 12, 14); scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x88aaff, 0.6, 80); rimLight.position.set(-10, 3, 8); scene.add(rimLight);

    // —— 程序化贴图 ——
    function makeGlow() {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'); const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.4, 'rgba(255,255,255,0.6)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
    }
    function makeNeedle() {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d'); g.translate(64, 64); g.lineCap = 'round';
      for (let i = 0; i < 95; i++) {
        const a = Math.random() * Math.PI * 2, len = 25 + Math.random() * 45;
        const l = 25 + Math.random() * 35;
        g.strokeStyle = `hsl(${100 + Math.random() * 35}, ${45 + Math.random() * 25}%, ${l}%)`;
        g.lineWidth = 1 + Math.random() * 2;
        g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * len, Math.sin(a) * len); g.stroke();
      }
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = 'destination-in';
      const rg = g.createRadialGradient(64, 64, 8, 64, 64, 64);
      rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }
    const glowTex = makeGlow(), needleTex = makeNeedle();

    const tree = new THREE.Group();
    scene.add(tree);

    // 1) 蓬松树冠（密度翻倍）
    const N = isMobile ? 5000 : 10000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), color = new THREE.Color();
    for (let i = 0; i < N; i++) {
      const t = Math.pow(Math.random(), 0.85);
      const y = t * 16 - 8;
      const ang = Math.random() * Math.PI * 2;
      let r = (1 - t) * 5 * (0.7 + 0.55 * Math.random());
      if (Math.random() < 0.12) r *= 1.25;
      pos.set([Math.cos(ang) * r, y, Math.sin(ang) * r], i * 3);
      color.setHSL(0.32 + (Math.random() - 0.5) * 0.05, 0.5 + Math.random() * 0.25, 0.22 + Math.random() * 0.26);
      col.set([color.r, color.g, color.b], i * 3);
    }
    const gTree = new THREE.BufferGeometry();
    gTree.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    gTree.setAttribute('color', new THREE.BufferAttribute(col, 3));
    tree.add(new THREE.Points(gTree, new THREE.PointsMaterial({
      size: 0.7, vertexColors: true, map: needleTex, transparent: true, depthWrite: false })));

    // 2) 树干
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.75, 2.4, 12),
      new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 0.9 }));
    trunk.position.y = -8 + 1.2; tree.add(trunk);

    // 3) 金色亮片螺旋彩带
    const G = isMobile ? 500 : 1000, gp = new Float32Array(G * 3), gc = new Float32Array(G * 3);
    for (let i = 0; i < G; i++) {
      const t = i / G, y = t * 16 - 8, ang = t * Math.PI * 2 * 6, r = (1 - t) * 5 * 1.05 + 0.15;
      gp.set([Math.cos(ang) * r, y, Math.sin(ang) * r], i * 3);
      const b = Math.random() < 0.4 ? 0.05 : 0.7 + 0.3 * Math.random();
      gc.set([b, b * 0.82, b * 0.45], i * 3);
    }
    const gGar = new THREE.BufferGeometry();
    gGar.setAttribute('position', new THREE.BufferAttribute(gp, 3));
    gGar.setAttribute('color', new THREE.BufferAttribute(gc, 3));
    tree.add(new THREE.Points(gGar, new THREE.PointsMaterial({
      size: 0.4, vertexColors: true, map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));

    // 4) 反光装饰球（更多、大小错落）
    const ballGeo = new THREE.SphereGeometry(0.3, 20, 20);
    const ballCols = [0xd62828, 0xe07a1f, 0xf2c14e, 0xc0392b, 0xb03a2e, 0xf5b041];
    const B = isMobile ? 12 : 22;
    for (let k = 0; k < B; k++) {
      const t = 0.1 + Math.random() * 0.85, y = t * 16 - 8, ang = Math.random() * Math.PI * 2, r = (1 - t) * 5 * (0.95 + Math.random() * 0.15);
      const c = ballCols[k % ballCols.length];
      const mesh = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: c, roughness: 0.22, metalness: 0.35, emissive: 0x111111 }));
      mesh.position.set(Math.cos(ang) * r, y, Math.sin(ang) * r);
      const s = 0.7 + Math.random() * 0.7; mesh.scale.setScalar(s);
      tree.add(mesh);
    }

    // 5) 顶部五角星（刻面凸星，随树一起旋转 + 光晕脉动）
    const starPts = [];
    const sOuter = 1.5, sInner = 0.62, sDepth = 0.3;
    for (let i = 0; i < 10; i++) { const r = i % 2 === 0 ? sOuter : sInner, a = Math.PI / 5 * i + Math.PI / 2; starPts.push([Math.cos(a) * r, Math.sin(a) * r, 0]); }
    const front = [0, 0, sDepth], back = [0, 0, -sDepth], sv = [];
    for (let i = 0; i < 10; i++) {
      const p1 = starPts[i], p2 = starPts[(i + 1) % 10];
      sv.push(...front, ...p1, ...p2);   // 正面刻面
      sv.push(...back, ...p2, ...p1);    // 背面刻面
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
    starGeo.computeVertexNormals();
    const star = new THREE.Mesh(starGeo, new THREE.MeshStandardMaterial({ color: 0xffd24a, metalness: 0.7, roughness: 0.25, emissive: 0x3a2600, flatShading: true }));
    star.position.set(0, 8.9, 0); tree.add(star);
    const starGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffe08a, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    starGlow.position.set(0, 8.9, 0); starGlow.scale.set(7, 7, 1); tree.add(starGlow);

    // 6) 地面蓝白散景光点
    function makeGround(count, size, palette) {
      const p = new Float32Array(count * 3), c = new Float32Array(count * 3), col = new THREE.Color();
      for (let i = 0; i < count; i++) {
        p.set([Math.random() * 54 - 27, -8 + Math.random() * 1.6, Math.random() * 54 - 27], i * 3);
        col.setHex(palette[(Math.random() * palette.length) | 0]);
        const b = 0.4 + Math.random() * 0.6; col.multiplyScalar(b);
        c.set([col.r, col.g, col.b], i * 3);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(c, 3));
      return new THREE.Points(geo, new THREE.PointsMaterial({ size, vertexColors: true, map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    }
    const ground = new THREE.Group(); scene.add(ground);
    const pal = [0x9fd0ff, 0xffffff, 0xbfe3ff, 0xffd7c2];
    const gSmall = makeGround(isMobile ? 500 : 1200, 0.35, pal);
    const gBig = makeGround(isMobile ? 120 : 300, 0.8, pal);
    ground.add(gSmall, gBig);

    // 7) 夜空背景星
    const bg = new Float32Array((isMobile ? 150 : 350) * 3);
    for (let i = 0; i < bg.length / 3; i++) {
      const a = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), R = 70 + Math.random() * 40;
      bg.set([Math.sin(ph) * Math.cos(a) * R, Math.abs(Math.cos(ph)) * R * 0.6 + 10, Math.sin(ph) * Math.sin(a) * R], i * 3);
    }
    const gBg = new THREE.BufferGeometry(); gBg.setAttribute('position', new THREE.BufferAttribute(bg, 3));
    scene.add(new THREE.Points(gBg, new THREE.PointsMaterial({ size: 0.6, color: 0xbcd0ff, map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));

    // 8) 飘雪
    const SN = isMobile ? 600 : 1200, snowPos = new Float32Array(SN * 3), snowSpd = new Float32Array(SN);
    for (let i = 0; i < SN; i++) {
      snowPos.set([Math.random() * 54 - 27, Math.random() * 30 - 8, Math.random() * 54 - 27], i * 3);
      snowSpd[i] = 0.02 + Math.random() * 0.04;
    }
    const gSnow = new THREE.BufferGeometry();
    gSnow.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
    const snow = new THREE.Points(gSnow, new THREE.PointsMaterial({ size: 0.22, color: 0xffffff, map: glowTex, transparent: true, opacity: 0.9, depthWrite: false }));
    scene.add(snow);

    // 9) 礼物盒（红/蓝/绿 + 金色丝带蝴蝶结），摆在树外圈，并入地面组一起旋转
    const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xf2c14e, roughness: 0.3, metalness: 0.6, emissive: 0x2a1e00 });
    function makeGift(baseColor) {
      const g = new THREE.Group();
      const w = 1.4, h = 1.0, d = 1.4, t = 0.16;
      const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.35, metalness: 0.35 }));
      box.position.y = h / 2; g.add(box);
      const r1 = new THREE.Mesh(new THREE.BoxGeometry(t, h + 0.02, d + 0.02), ribbonMat); r1.position.y = h / 2; g.add(r1);
      const r2 = new THREE.Mesh(new THREE.BoxGeometry(w + 0.02, h + 0.02, t), ribbonMat); r2.position.y = h / 2; g.add(r2);
      for (let i = 0; i < 4; i++) {
        const rot = i * Math.PI / 2;
        const loop = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.08, 0.34), ribbonMat);
        loop.position.set(Math.cos(rot) * 0.28, h + 0.14, Math.sin(rot) * 0.28);
        loop.rotation.y = rot; loop.rotation.z = 0.6; g.add(loop);
      }
      const knot = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), ribbonMat); knot.position.y = h + 0.14; g.add(knot);
      return g;
    }
    const giftColors = [0xd62828, 0x1f6fb2, 0x2a9d3a, 0xc0392b, 0x2e86de, 0x27ae60];
    const giftDefs = [
      { x: 5.5, z: 3.0, s: 1.15, ry: 0.5, c: 0 },
      { x: -6.0, z: 2.0, s: 0.95, ry: -0.4, c: 1 },
      { x: 1.5, z: 7.0, s: 1.35, ry: 0.2, c: 2 },
      { x: -3.0, z: -6.0, s: 0.85, ry: 0.9, c: 3 },
      { x: 7.0, z: -2.0, s: 1.05, ry: -0.7, c: 4 },
      { x: -7.0, z: -1.0, s: 1.1, ry: 0.3, c: 5 },
    ];
    giftDefs.forEach(def => {
      const gift = makeGift(giftColors[def.c]);
      gift.position.set(def.x, -8, def.z);
      gift.scale.setScalar(def.s);
      gift.rotation.y = def.ry;
      ground.add(gift); // 跟着地面一起旋转
    });

    // 交互
    let dragging = false, lastX = 0, pinchDist = 0, baseZ = 14;
    const down = x => { dragging = true; lastX = x; };
    const move = x => { if (dragging) { tree.rotation.y += (x - lastX) * 0.008; lastX = x; } };
    const up = () => { dragging = false; };
    const tDist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    addEventListener('mousedown', e => { down(e.clientX); document.body.classList.add('grabbing'); });
    addEventListener('mousemove', e => move(e.clientX));
    addEventListener('mouseup', () => { up(); document.body.classList.remove('grabbing'); });
    addEventListener('touchstart', e => { if (e.touches.length === 1) down(e.touches[0].clientX); else if (e.touches.length === 2) { dragging = false; pinchDist = tDist(e); baseZ = camera.position.z; } }, { passive: false });
    addEventListener('touchmove', e => { if (e.touches.length === 1) { move(e.touches[0].clientX); e.preventDefault(); } else if (e.touches.length === 2) { camera.position.z = clamp(baseZ * pinchDist / tDist(e), 6, 40); e.preventDefault(); } }, { passive: false });
    addEventListener('touchend', up);
    addEventListener('wheel', e => { camera.position.z = clamp(camera.position.z + e.deltaY * 0.02, 6, 40); });

    function fit() {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      baseZ = Math.max(12, 7.5 / camera.aspect); camera.position.z = baseZ;
    }
    fit(); addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));

    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.03;
      if (!dragging) tree.rotation.y += 0.0025; // 星星随树一起转
      ground.rotation.y += 0.0006;              // 礼物盒随地面一起转
      const ssc = 1 + 0.06 * Math.sin(time * 2);
      star.scale.set(ssc, ssc, ssc);            // 星星轻微呼吸
      starGlow.material.opacity = 0.45 + 0.35 * Math.sin(time * 1.3);
      gSmall.material.opacity = 0.7 + 0.3 * Math.sin(time * 0.7);
      gBig.material.opacity = 0.6 + 0.4 * Math.sin(time * 0.5 + 1);
      const sp = gSnow.attributes.position.array;
      for (let i = 0; i < SN; i++) {
        sp[i * 3 + 1] -= snowSpd[i];
        sp[i * 3] += Math.sin(time + i) * 0.003;
        if (sp[i * 3 + 1] < -9) { sp[i * 3 + 1] = 22; sp[i * 3] = Math.random() * 54 - 27; sp[i * 3 + 2] = Math.random() * 54 - 27; }
      }
      gSnow.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
    }
    animate();
    <!-- ... existing code ... -->
    // ===== 背景音乐(We Wish You a Merry Christmas) + 点击开始封面 =====
    const bgm = new Audio('music.mp3');   // 音频文件 music.mp3 与本页放同一 deploy 目录
    bgm.loop = true;
    bgm.volume = 0.6;
    const btn = document.getElementById('musicBtn');
    const cover = document.getElementById('startCover');
    let playing = false, started = false;
    const setUI = () => { btn.classList.toggle('playing', playing); btn.textContent = playing ? '🎵' : '🔇'; };
    function playBgm() { bgm.play().then(() => { playing = true; setUI(); }).catch(() => {}); }
    function toggle() { if (playing) { bgm.pause(); playing = false; } else { playBgm(); } setUI(); }
    btn.addEventListener('click', e => { e.stopPropagation(); toggle(); });

    // 点击封面：淡出 + 在用户手势里启动音乐（任何设备都能响）
    function start() {
      if (started) return; started = true;
      cover.classList.add('hidden');
      setTimeout(() => { cover.style.display = 'none'; }, 800);
      playBgm();
    }
    cover.addEventListener('click', start);
    document.getElementById('startBtn').addEventListener('click', e => { e.stopPropagation(); start(); });
    setUI();
    <!-- ... existing code ... -->
  </script>
</body>
</html>
